<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Docker Web Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f0f1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid #e94560;
            border-radius: 12px;
            background-color: #1a1a2e;
            max-width: 600px;
            width: 90%;
        }

        .badge {
            background-color: #e94560;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #e94560;
            margin-bottom: 10px;
        }

        p {
            color: #a8a8b3;
            margin: 8px 0;
            font-size: 1rem;
        }

        .status {
            margin-top: 24px;
            padding: 12px;
            background-color: #0f3460;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .status span {
            color: #00ff88;
        }

        .tech-stack {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tech {
            background-color: #16213e;
            border: 1px solid #0f3460;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #a8a8b3;
        }

        .footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">CodeAlpha DevOps Internship</div>
        <h1> Docker Web Server</h1>
        <p>Running Successfully inside a Docker Container</p>
        <p>Served by <strong>Nginx</strong> on port 80</p>

        <div class="status">
            Container Status: <span>● Running</span>
        </div>

        <div class="tech-stack">
            <span class="tech">🐳 Docker</span>
            <span class="tech">⚙️ Nginx</span>
            <span class="tech">📦 Docker Compose</span>
            <span class="tech">🌐 HTML/CSS</span>
        </div>

        <div class="footer">
            <p>Created by Oluwatobi Ogundimu</p>
            <p>Task 4 Web Server using Docker</p>
        </div>
    </div>
</body>
</html>
